version: '3'

volumes:
  limelight_video_local_postgres_data: {}
  limelight_video_local_postgres_data_backups: {}

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: limelight_video_local_django
    container_name: limelight_video_local_django
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app:z
    env_file:
      - ./.env
    ports:
      - '8000:8000'
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: limelight_video_production_postgres
    container_name: limelight_video_local_postgres
    volumes:
      - limelight_video_local_postgres_data:/var/lib/postgresql/data
      - limelight_video_local_postgres_data_backups:/backups
    env_file:
      - ./.env

  redis:
    image: redis:6
    container_name: limelight_video_local_redis

  celeryworker:
    <<: *django
    image: limelight_video_local_celeryworker
    container_name: limelight_video_local_celeryworker
    depends_on:
      - redis
      - postgres
    ports: []
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: limelight_video_local_celerybeat
    container_name: limelight_video_local_celerybeat
    depends_on:
      - redis
      - postgres
    ports: []
    command: /start-celerybeat

  flower:
    <<: *django
    image: limelight_video_local_flower
    container_name: limelight_video_local_flower
    ports:
      - '5555:5555'
    command: /start-flower
