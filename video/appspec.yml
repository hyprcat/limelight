version: 0.0
os: linux
files:
  - source: /
    destination: /home/ubuntu/LimeLight-Video
permissions:
  - object: /home/ubuntu/LimeLight-Video/scripts
    mode: 777
    type:
      - directory
hooks:
  BeforeInstall:
    - location: ./scripts/before-install.sh
      timeout: 3600
  AfterInstall:
    - location: scripts/after-install.sh
      timeout: 3600
  ApplicationStart:
    - location: scripts/boot.sh
      timeout: 3600
